<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C14">
  <meta name="description" content="ORPHEUS — a guitar practice partner that listens: tuner, chord checks, rhythm.">
  <title>ORPHEUS 琴 — a guitar that listens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0C14'/%3E%3Cpath d='M6 6h8M6 6v8M26 26h-8M26 26v-8' stroke='%23E9E7F2' stroke-width='2' fill='none'/%3E%3Cpath d='M12 10v12M16 10v12M20 10v12' stroke='%237A6BA8' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    /* Just enough to paint the start-up screen before anything else has loaded. */
    html { background: #0B0C14; color: #E9E7F2; }
    body { margin: 0; }
    #boot { position: fixed; inset: 0; z-index: 20; background: #0B0C14; display: flex; align-items: center; justify-content: center;
      font: 11px/1.7 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    #boot .boot-in { width: min(78vw, 340px); }
    #boot .boot-head { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(233,231,242,.3); padding-bottom: 8px; margin-bottom: 12px; }
    #boot .boot-lines { list-style: none; margin: 0; padding: 0; min-height: 8em; }
    #boot .cores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; height: 132px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <!-- Start-up check. Shown at once; the rest loads behind it. -->
  <div id="boot" role="status" aria-label="Starting up">
    <div class="boot-in">
      <div class="boot-head"><span>ORPHEUS</span><span class="boot-jp">琴 起動</span></div>
      <div class="cores" aria-hidden="true">
        <div class="core"><span class="core-no">CORE·1</span><b>耳</b><em>EAR</em><i></i></div>
        <div class="core"><span class="core-no">CORE·2</span><b>手</b><em>HAND</em><i></i></div>
        <div class="core"><span class="core-no">CORE·3</span><b>律</b><em>TIME</em><i></i></div>
      </div>
      <ol class="boot-lines"></ol>
      <div class="boot-bar"><i></i></div>
      <div class="boot-go"><span>ORPHEUS ONLINE</span><b>琴</b></div>
      <div class="boot-skip">TAP TO SKIP ▸</div>
    </div>
  </div>

  <div id="fallback" aria-hidden="true"></div>
  <canvas id="stage" aria-label="A 3D electric guitar. Drag to rotate, tap the strings to play."></canvas>

  <!-- The focus window's frame. The sharp picture inside it is drawn by the shader. -->
  <div id="fw" class="fw" aria-hidden="true">
    <i class="fw-c tl"></i><i class="fw-c tr"></i><i class="fw-c bl"></i><i class="fw-c br"></i>
    <i class="fw-cross"></i>
    <span class="fw-top"><b>FCS-01</b> <span class="fw-state">SEEK 探索</span></span>
    <span class="fw-tgt">TGT —</span>
  </div>

  <div id="chapters"></div>
  <div id="hud"></div>

  <!-- Invisible: only here to give the page its scroll length. -->
  <div id="track" aria-hidden="true"></div>

  <!-- Print dirt over everything: grain + fold lines. -->
  <div id="grain" aria-hidden="true"></div>
  <svg id="creases" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M0 31.2 L14 31.4 L29 31.1 L47 31.5 L52 31.3 L71 31.6 L100 31.2" />
    <path d="M0 73.8 L22 73.6 L38 74 L64 73.7 L83 74.1 L100 73.8" />
    <path d="M61.5 0 L61.8 18 L61.4 41 L61.9 66 L61.6 100" class="faint" />
    <path d="M58 44 L60.5 46.2 L63 45.5 L66 48" class="scratch" />
    <path d="M8 86 L19 83.5" class="scratch" />
    <path d="M77 12 L81 16.5 L80 19" class="scratch" />
    <path d="M33 57 L36 57.6 L41 56.8" class="scratch" />
  </svg>

  <div id="cursor" aria-hidden="true"><i></i><b></b></div>

  <noscript><p style="position:fixed;inset:auto 0 0 0;padding:16px;font:12px monospace;z-index:30">This site needs JavaScript. The practice app is at <a href="/practice/" style="color:inherit">/practice/</a>.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
