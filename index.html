<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button id="back" class="back" aria-label="Back" hidden>‹</button>
      <span id="title" class="title">Home</span>
    </header>

    <!-- ========== Home ========== -->
    <section class="screen" data-screen="home">
      <a class="today" href="#/today">
        <span>
          <span class="today-label">Today's session</span>
          <span class="today-sub">Guided, based on your log</span>
        </span>
        <span class="today-play">▶</span>
      </a>

      <h2 class="section">Exercises</h2>
      <nav class="list">
        <a href="#/exercise/clean-check">Clean chord check<span class="chev">›</span></a>
        <a href="#/exercise/change-drill">Chord change drill<span class="chev">›</span></a>
        <a href="#/exercise/find-note">Find the note<span class="chev">›</span></a>
        <a href="#/exercise/rhythm">Rhythm<span class="chev">›</span></a>
        <a href="#/tuner">Tuner<span class="chev">›</span></a>
      </nav>

      <nav class="list list-gap">
        <a href="#/songs">Songs<span class="chev">›</span></a>
        <a href="#/log">Log<span id="log-count" class="count"></span><span class="chev">›</span></a>
      </nav>
    </section>

    <!-- ========== Coming soon (placeholder for unbuilt screens) ========== -->
    <section class="screen" data-screen="soon">
      <div class="soon">
        <p id="soon-text" class="soon-text"></p>
        <a class="link-btn" href="#/">Back to home</a>
      </div>
    </section>

    <!-- ========== Log ========== -->
    <section class="screen" data-screen="log">
      <div id="log-list"></div>
      <p id="log-empty" class="empty" hidden>
        Nothing logged yet.<br>Finished exercises will show up here.
      </p>
    </section>

    <!-- ========== Tuner (v1) ========== -->
    <section class="screen tuner" data-screen="tuner">
      <section class="readout" aria-live="polite">
        <div id="note" class="note silent">—</div>
        <div id="hz" class="hz">&nbsp;</div>
      </section>

      <section class="meter">
        <div class="meter-row">
          <span class="sym">♭</span>
          <div class="track">
            <div class="center-mark"></div>
            <div id="needle" class="needle"></div>
          </div>
          <span class="sym">♯</span>
        </div>
        <div id="cents" class="cents">&nbsp;</div>
      </section>

      <nav class="modes" id="modes">
        <button class="mode active" data-mode="auto">Auto</button>
        <button class="mode" data-mode="0">E</button>
        <button class="mode" data-mode="1">A</button>
        <button class="mode" data-mode="2">D</button>
        <button class="mode" data-mode="3">G</button>
        <button class="mode" data-mode="4">B</button>
        <button class="mode" data-mode="5">E</button>
      </nav>

      <button id="start" class="start">Start listening</button>
      <p id="error" class="error" hidden></p>
    </section>
  </div>

  <script src="store.js"></script>
  <script src="tuner.js"></script>
  <script src="app.js"></script>
</body>
</html>
