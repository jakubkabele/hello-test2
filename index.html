<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>Tuner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">Tuner</header>

    <section class="readout" aria-live="polite">
      <div id="note" class="note silent">—</div>
      <div id="hz" class="hz">&nbsp;</div>
    </section>

    <section class="meter">
      <div class="meter-row">
        <span class="sym">♭</span>
        <div class="track">
          <div class="center-mark"></div>
          <div id="needle" class="needle"></div>
        </div>
        <span class="sym">♯</span>
      </div>
      <div id="cents" class="cents">&nbsp;</div>
    </section>

    <nav class="modes" id="modes">
      <button class="mode active" data-mode="auto">Auto</button>
      <button class="mode" data-mode="0">E</button>
      <button class="mode" data-mode="1">A</button>
      <button class="mode" data-mode="2">D</button>
      <button class="mode" data-mode="3">G</button>
      <button class="mode" data-mode="4">B</button>
      <button class="mode" data-mode="5">E</button>
    </nav>

    <button id="start" class="start">Start listening</button>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
